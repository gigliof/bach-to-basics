name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend - lint, type-check, test & build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in the root package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint --max-warnings 0

      - name: Type-check
        run: pnpm --filter frontend exec tsc --noEmit

      - name: Test
        run: pnpm --filter frontend exec vitest run --reporter=verbose

      # The production build catches what the steps above can't: bundler/plugin
      # breakage (e.g. an override pulling Babel 8 broke the PWA service worker
      # while lint, types and tests stayed green).
      - name: Build
        run: pnpm --filter frontend build

  backend:
    name: Backend - test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      # Same Python as backend/Dockerfile
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest -v

  docker:
    name: Docker - build images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Builds both images exactly as `docker compose up` would; nothing is pushed
      - name: Build
        run: docker compose build
