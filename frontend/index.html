<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- T4-1: Content Security Policy: restrict script/style/connect sources.
         'unsafe-inline' for script-src is needed for the error overlay below;
         tighten by moving it to a separate .js file if desired. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://gleitz.github.io https://danigb.github.io https://smpldsnds.github.io https://goldst.dev; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" />
    <title>Bach to Basics</title>
    <meta name="description" content="Browser-based piano practice tool. Import MIDI, MusicXML, or PDF sheet music and learn pieces with falling notes, interactive piano, A/B loop, speed trainer, and wait mode." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-light.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Anti-flash + boot theme: apply the persisted/system theme to <html>
      // BEFORE first paint, mirroring getInitialTheme() in the app exactly
      // (localStorage "b2b-theme" -> prefers-color-scheme -> light fallback).
      // React sets the same value on mount, so there's no conflict - this just
      // makes the cold-load window (before the JS bundle parses) show the right
      // background instead of a white flash. Wrapped in try/catch so a blocked
      // localStorage (private mode) can never break boot.
      (function () {
        try {
          var t = localStorage.getItem("b2b-theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <style>
      /* Boot placeholder shown during the cold-load window (bundle download +
         parse + service-worker install) before React mounts. Lives inside #root
         so React's createRoot().render() replaces it automatically on first
         render - no cleanup code needed. Inline so it works before the CSS
         chunk loads. Colors mirror --color-bg (dark #1a1a2e / light #ffffff). */
      html { background: #1a1a2e; }
      html[data-theme="light"] { background: #ffffff; }
      #b2b-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a1a2e;
      }
      html[data-theme="light"] #b2b-boot { background: #ffffff; }
      #b2b-boot .b2b-spinner {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3px solid rgba(147, 51, 234, 0.25);
        border-top-color: #9333ea;
        animation: b2b-spin 0.8s linear infinite;
      }
      @keyframes b2b-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="b2b-boot"><div class="b2b-spinner"></div></div>
    </div>
    <!-- Error catcher: shows any unhandled JS error directly on screen -->
    <div id="error-overlay" style="display:none;position:fixed;inset:0;background:#1a0000;color:#ff6b6b;padding:24px;font:14px monospace;z-index:9999;white-space:pre-wrap;overflow:auto;"></div>
    <script>
      // T3-3: Only show detailed stack traces in development (localhost).
      // Production displays a user-friendly message without file paths.
      var isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('error-overlay');
        el.style.display = 'block';
        el.textContent = isDev
          ? 'JS ERROR:\n' + msg + '\n\nFile: ' + src + ':' + line + '\n\n' + (err && err.stack ? err.stack : '')
          : 'Something went wrong. Please reload the page.';
      };
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('error-overlay');
        el.style.display = 'block';
        if (isDev) {
          el.textContent = (el.textContent || '') + '\n\nUNHANDLED PROMISE:\n' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
        } else if (!el.textContent) {
          el.textContent = 'Something went wrong. Please reload the page.';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
