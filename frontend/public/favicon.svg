  <style>
    .lm { display: block; }
    .dm { display: none;  }
    @media (prefers-color-scheme: dark) {
      .lm { display: none;  }
      .dm { display: block; }
    }
  </style>
  <image class="lm" href="data:image/png;base64," width="32" height="32"/>
  <image class="dm" href="data:image/png;base64,"  width="32" height="32"/>
</svg>